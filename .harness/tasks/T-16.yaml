  bilerek reddeder. Test pytest''in çözülmüş tmp_path''ine taşındı. Aynı koşulu Linux''ta
  symlink''li TMPDIR ile üretirken uzun yolda satır kırılan bir CLI çıktısı assertion''ı da
  bulundu; boşluklar normalize edildi. Üretim kodu değişmez.'
