review:
  status: approved
  by: reviewer
  notes: 'Three read-only reviewer subagents, none ran commands. Round 1 CHANGES REQUESTED (stranded IN_PROGRESS tasks, no compare-and-set, stale evidence accepted, unbounded log, blocking lock wait); round 2 CHANGES REQUESTED (cancellation during settle, unrecorded result hidden, markup escape, snapshot timing); all fixed with tests. Round 3 APPROVED with two LOW notes: a narrow cancel window before a child task first runs (fixed by releasing all claimed tasks when gather is interrupted) and a cancel test that did not prove the cancel landed during the run (fixed with an event). Those two fixes are not re-reviewed. Open LOW: the recorded flag in ok is defensive and not isolated by a test; release can block the loop up to the lock wait on a stale lock. Not verified: behaviour with a real Claude session (a trial was blocked by the permission classifier and not run).'
