schema_version: 1
id: T-12
title: 'Uygulama adım 6b: sunucuda eylemler (wave, review, commit) arka plan işi olarak ve
  canlı olay akışı'
owner: developer
status: IN_REVIEW
goal: 'Sunucudan wave, review ve commit başlatmak: tek aktif iş, JSON gövde, sınırlı parametre,
  SSE ile sıralı canlı olaylar, iptal ve temiz kapanış. Aynı orkestratör fonksiyonları kullanılır;
  sunucu yeni bir karar mantığı eklemez. Tarayıcı için token hand-off bu görevde yok (arayüz
  görevinde).'
scope:
- src/agent_harness/jobs.py
- src/agent_harness/server.py
- src/agent_harness/engine/describe.py
- src/agent_harness/cli.py
- tests/test_jobs.py
- tests/test_server.py
- README.md
- .harness/
acceptance:
- id: AC1
  text: POST /api/jobs token ister, yalnız tam olarak application/json kabul eder (aksi 415,
    bildirilen büyük gövde 413), bilinmeyen alan ya da sınır dışı değer ve türe uymayan parametre
    422 verir, geçerli istek 202 ile iş kimliği döner; aktif iş varken ikinci istek 409 alır.
- id: AC2
  text: İş, CLI ile aynı fonksiyonları (run_wave, review_all, commit_done_tasks) enjekte edilen
    engine ile çalıştırır; HarnessError, OSError, UnicodeError ve engine kurulum hatası işi
    failed yapar ve mesajı taşır, beklenmeyen hata ve BaseException işi failed yapar (iş asla
    sonsuza dek running kalmaz), 500 vermez; sonuç CLI --json çıktısıyla aynı biçimde ve aynı
    satırlardadır.
- id: AC3
  text: GET /api/jobs/{id}/events SSE akışı sıralı id ile olayları verir, after ya da Last-Event-ID
    ile kaldığı yerden sürer, iş bitince kapanır; olay tamponu ve olay metni sınırlıdır; bilinmeyen
    iş 404.
- id: AC4
  text: POST /api/jobs/{id}/cancel çalışan wave ya da review'ı iptal eder ve wave görevleri
    READY'ye döner; commit işi iptal edilemez (409); biten işte 409. Sunucu kapanırken açık
    bir olay akışı varken bile süreç grace süresi (3 sn) içinde kapanır, çalışan iş iptal
    edilir (commit bitirilir) ve görevler READY'ye döner; bu gerçek uvicorn ile test edilir.
- id: AC5
  text: GET /api/jobs ve /api/jobs/{id} durum, parametre ve sonucu verir; tutulan iş sayısı
    sınırlıdır. Testler yalnız unit testtir (sahte engine, gerçek ledger dosyaları); pytest,
    ruff check ve ruff format --check geçer.
