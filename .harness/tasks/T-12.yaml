acceptance:
- id: AC1
  text: POST /api/jobs token ister, yalnız application/json kabul eder (aksi 415), bilinmeyen
    alan ya da sınır dışı değer ve türe uymayan parametre 422 verir, geçerli istek 202 ile
    iş kimliği döner; aktif iş varken ikinci istek 409 alır.
- id: AC2
  text: İş, CLI ile aynı fonksiyonları (run_wave, review_all, commit_done_tasks) enjekte edilen
    engine ile çalıştırır; HarnessError, OSError ve engine kurulum hatası işi failed yapar
    ve mesajı taşır, 500 vermez; sonuç CLI çıktısıyla aynı satırları içerir.
- id: AC3
  text: GET /api/jobs/{id}/events SSE akışı sıralı id ile olayları verir, after ya da Last-Event-ID
    ile kaldığı yerden sürer, iş bitince kapanır; olay tamponu ve olay metni sınırlıdır; bilinmeyen
    iş 404.
- id: AC4
  text: POST /api/jobs/{id}/cancel çalışan işi iptal eder ve wave görevleri READY'ye döner;
    biten işte 409; sunucu kapanırken çalışan iş iptal edilir ve kapanış takılmaz.
- id: AC5
  text: GET /api/jobs ve /api/jobs/{id} durum, parametre ve sonucu verir; tutulan iş sayısı
    sınırlıdır. Testler yalnız unit testtir (sahte engine, gerçek ledger dosyaları); pytest,
    ruff check ve ruff format --check geçer.
