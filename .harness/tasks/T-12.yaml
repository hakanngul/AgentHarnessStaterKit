review:
  status: changes_requested
  by: reviewer
  notes: 'Round 1: no critical defect in the job state machine. Found: (1) shutdown hangs
    while an SSE stream is open (confirmed with real uvicorn: test waited 20 s) -> 3 s grace
    period, tested with a real server; (2) GET /api/jobs read the job table from a worker
    thread -> async handlers; (3) no test raised OSError inside a job; (4) lifecycle tests
    lacked a timeout guard and a running-commit shutdown test; (5) review result shape differed
    from the CLI -> aligned; (6) stale read-only docstring and CLI help; (7) README cap wording;
    (8) exact content-type, Content-Length pre-check, BaseException handler. Sonar: CancelledError
    now re-raised after bookkeeping, lifespan cleanup in try/finally. All proven by mutation
    checks.'
