schema_version: 1
id: T-14
title: 'Tarayıcı için sunucu hazırlığı: güvenlik başlıkları, --ui ile statik arayüz, token
  devri'
owner: developer
status: IN_REVIEW
goal: 'React arayüzü yazılmadan önce sunucuyu tarayıcıya hazırlamak. Karar (kendi görüşüm,
  önceki ''çerez + Origin'' önerimi değiştirdim): token URL fragment''inde taşınır (sunucuya
  hiç gitmez), arayüz onu bellekte tutar ve REST ile SSE için Authorization başlıklı fetch
  kullanır; EventSource kullanılmaz. Ortam kimlik bilgisi (çerez) olmadığı için CSRF yüzeyi
  yoktur ve sunucudaki Bearer doğrulaması aynen kalır. Sunucu yalnız (1) her yanıta güvenlik
  başlıkları ekler, (2) `--ui DIR` verilirse derlenmiş arayüzü salt okunur ve token''sız sunar.
  Arayüzün kendisi bu görevin dışında.'
scope:
- src/agent_harness/server.py
- src/agent_harness/cli.py
- tests/test_server.py
- tests/test_cli.py
- README.md
- .harness/
acceptance:
- id: AC1
  text: 'Her yanıt (200, 401, 403 geçersiz Host, 404, 405, 413, SSE akışı) nosniff, DENY çerçeve,
    no-referrer, CSP (default-src ''self'', connect-src ''self'', frame-ancestors ''none'',
    base-uri ''none'', object-src ''none'') ve /api için Cache-Control: no-store taşır.'
- id: AC2
  text: '`--ui DIR` ile index.html ve varlıklar token''sız sunulur, /api rotaları gölgelenmez
    (health açık, diğerleri 401); POST ve diğer yöntemler statik yolda 405; `..` ile çıkış
    ve dizin dışına işaret eden sembolik bağlantı 404; ui verilmezse `/` bugünkü gibi 404.'
- id: AC3
  text: Statik yol da Host denetiminden geçer (geçersiz Host 403); `serve` eksik dizin ya
    da index.html'i dinlemeye başlamadan HarnessError ile reddeder.
- id: AC4
  text: README token devrini anlatır (fragment, history.replaceState ile silme, fetch akışı
    ve `after` ile devam, çerez bilinçli olarak yok) ve sınırları söyler (token'ı bilen herkes
    iş başlatabilir, TLS yok).
- id: AC5
  text: pytest, ruff check, ruff format --check ve harness check geçer; yeni davranışın her
    biri mutation ile kanıtlanır (düzeltmeyi geri al, bir test kırılmalı).
