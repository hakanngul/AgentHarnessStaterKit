- '2026-11-17 developer: ui/ (Vite 8, React 19, TypeScript, vitest), token/api/sse/follow modülleri, TaskList,
  JobsPanel, App; CI''ya ui işi. Test sırasında gerçek bir SSE ayrıştırıcı hatası bulundu (akış sonunda
  tutulan son CR satır sonu sayılmıyordu): düzeltildi, test kaldırınca kırılıyor. followJob''da sonsuz
  döngü riski (bitmiş işte akış boş) ilerleme korumasıyla kapatıldı, testli. Gerçek Chromium (Playwright)
  ile elle uçtan uca deneme: fragment devri ve adres temizleme, görev tablosu (işaretli başlık metin olarak),
  commit işi canlı akış, yanlış token 401, 0 çerez, 0 storage, CSP ihlali yok, tüm API istekleri Bearer
  taşıdı. Bu deneme komut dosyası olarak depoda değil, otomatik testle kanıtlanmış sayılmaz.'
