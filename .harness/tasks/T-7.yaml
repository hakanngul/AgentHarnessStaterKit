acceptance:
- id: AC1
  text: config'te rol başına opsiyonel `model`, `effort` ve `bash` (izinli komut önekleri)
    tanımlanır, katı şemayla doğrulanır; mevcut config'ler geçerli kalır ve JSON şeması
    modelle eşleşir.
- id: AC2
  text: İzin politikası, rolün yazma kapsamı dışındaki dosya yazımını ve `bash` listesinde
    olmayan ya da zincirleme (;, &&, |, yönlendirme, alt kabuk) komutları reddeder;
    okuma araçlarına izin verir.
- id: AC3
  text: Görev istemi görevin başlığını, hedefini, kabul kriterlerini ve kapsamını içerir;
    ajana commit atmamasını ve `.harness/state/` belgelerini güncellememesini söyler.
- id: AC4
  text: Çalıştırıcı geçersiz defterde, bilinmeyen görevde, bilinmeyen rolde ve READY ya
    da IN_PROGRESS olmayan görevde motoru hiç çağırmadan reddeder.
- id: AC5
  text: Limit dolup koşu hatayla bitince sıfırlanma zamanına kadar bekler ve aynı oturumu
    sürdürür; deneme sayısı ya da bekleme sınırı aşılırsa beklemeden `rate_limited`
    döner. Diğer hatalar `failed` döner.
- id: AC6
  text: Claude SDK mesajları motor olaylarına doğru çevrilir; SDK kurulu değilse `harness
    run` kurulum talimatıyla 1 ile çıkar. Testler yalnız unit testtir, gerçek Claude
    çağrısı yapmaz.
