    tanımlanır, katı şemayla doğrulanır; mevcut config'ler geçerli kalır ve JSON şeması modelle
    eşleşir.
  verified_by:
  - E1
  - E4
- id: AC2
  text: 'İzin politikası varsayılan olarak reddeder: rolün yazma kapsamı dışındaki dosya yazımını,
    `bash` listesinde olmayan ya da zincirleme komutları, MCP ve ağ araçlarını, tanımadığı
    araçları ve proje dışı okumaları reddeder; `harness evidence run` yalnız `--` sonrası
    komut listedeyse geçer. Politika PreToolUse hook''u olarak da bağlanır, böylece proje
    ayarlarındaki izin kuralları onu atlayamaz.'
  verified_by:
  - E1
- id: AC3
  text: Görev istemi görevin başlığını, hedefini, kabul kriterlerini ve kapsamını içerir;
    ajana commit atmamasını ve `.harness/state/` belgelerini güncellememesini söyler.
  verified_by:
  - E1
- id: AC4
  text: Çalıştırıcı geçersiz defterde, bilinmeyen görevde, bilinmeyen rolde ve READY ya da
    IN_PROGRESS olmayan görevde motoru hiç çağırmadan reddeder.
  verified_by:
  - E1
- id: AC5
  text: Limit dolup koşu hatayla bitince bekleme olayını yayar, sıfırlanma zamanına kadar
    bekler ve aynı oturumu sürdürür; deneme sayısı ya da bekleme sınırı aşılırsa beklemeden
    `rate_limited` döner. Diğer hatalar ve motorun fırlattığı istisnalar oturum kimliği korunarak
    `failed` döner.
  verified_by:
  - E1
- id: AC6
  text: Claude SDK mesajları motor olaylarına doğru çevrilir; SDK kurulu değilse `harness
    run` kurulum talimatıyla 1 ile çıkar. Testler yalnız unit testtir, gerçek Claude çağrısı
    yapmaz.
  verified_by:
  - E1
  - E2
  - E3
