review:
  status: changes_requested
  by: reviewer
  notes: 'Round 1 (read-only reviewer subagent, ran nothing): CHANGES REQUESTED. HIGH the reviewer role could write every task file and only two fields of one task were frozen, so a review could forge DONE, owner or another task. MEDIUM stale, failing-latest or agent-written evidence could back an approval; conflicting verdict lines and developer text could inject a verdict; --task with a non-reviewable task exited 0; a settle crash lost sibling results. LOW lost verified_by, README gaps, test gaps. Fixed afterwards: review runs are read-only in the policy hook, the whole task is frozen and any change blocks it, approval needs harness-recorded passing evidence and no failing latest run, ambiguity fails closed, prompt text is flattened and quoted, explicit --task errors, any settle exception is contained, README corrected. The fixes are not re-reviewed yet.'
