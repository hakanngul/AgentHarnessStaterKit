acceptance:
- id: AC1
  text: Reviewer çıktısından son `VERDICT:` satırı ve her kriter için kanıt kimliği ayrıştırılır;
    onay yalnız her kriter kaydedilmiş ve geçen bir kanıta bağlıysa DONE yapar (verified_by
    doldurulur, review approved, defter geçerli kalır); aksi hâlde değişiklik istendi sayılır.
  verified_by:
  - E1
- id: AC2
  text: Değişiklik istendiğinde görev READY'ye döner ve reviewer notları sonraki geliştirici
    istemine veri olarak eklenir; ikinci dalga görevi yeniden IN_REVIEW'a getirir.
  verified_by:
  - E1
- id: AC3
  text: Karar satırı yoksa ya da review koşusu başarısızsa görev IN_REVIEW'da kalır ve log'a
    yazılır; reviewer kanıtı ya da kabul kriterlerini değiştirirse görev BLOCKED olur.
  verified_by:
  - E1
- id: AC4
  text: Yalnız IN_REVIEW görev incelenir; görev sahibi reviewer olamaz; tanımsız rol defteri
    değiştirmez. Bir görevin reddi diğerlerini durdurmaz.
  verified_by:
  - E1
- id: AC5
  text: '`harness review [PATH] [--task] [--role] [--max-parallel] [--json]` ve `harness wave
    --review` sonucu gösterir; hepsi DONE olduysa 0, değilse 1 ile çıkar. Testler yalnız unit
    testtir.'
  verified_by:
  - E1
  - E2
  - E3
