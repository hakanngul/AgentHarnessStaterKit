review:
  status: approved
  by: reviewer
  notes: 'Two read-only reviewer subagents, neither ran commands. Round 1 CHANGES REQUESTED (HIGH: the reviewer role could write every task file and only part of one task was frozen; MEDIUM: weak evidence rules, verdict injection, silent --task, lost sibling results); all fixed. Round 2 APPROVED with non-blocking findings: read-only runs still allowed `harness evidence run` for a reviewer with a bash list (fixed: denied in read-only runs), an unflattened task title in the review prompt (fixed), missing wiring test for read_only in claude.py and NotebookEdit (added). Those last fixes are not re-reviewed. Open and documented: tampering is detected but not reverted; a bash list on the reviewer can still write files; harness-recorded evidence is a YAML field, so a developer can forge it (pre-existing limit of the evidence model); SDK hook coverage of subagent tool calls unverified. A real-session trial (throwaway project) ran wave then review and both tasks reached DONE before the read-only fix; the read-only path itself was not re-run against a real session.'
