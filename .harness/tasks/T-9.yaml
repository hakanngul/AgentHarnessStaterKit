  verified_by:
  - E4
- id: AC4
  text: Yalnız IN_REVIEW görev incelenir; görev sahibi reviewer olamaz; tanımsız rol defteri
    değiştirmez. Bir görevin reddi diğerlerini durdurmaz.
  verified_by:
  - E4
- id: AC5
  text: '`harness review [PATH] [--task] [--role] [--max-parallel] [--json]` ve `harness wave
    --review` sonucu gösterir; hepsi DONE olduysa 0, değilse 1 ile çıkar. Testler yalnız unit
    testtir.'
