log:
- '2026-11-16 developer: task opened; follows the T-12 review findings (wave claim race, shared git index,
  git without timeout); flock chosen over an O_EXCL file because a crash must not leave a lock behind'
- '2026-11-16 developer: runlock.py, CLI and server integration, run_wave claim fix, git timeout; 24 new
  tests; every fix mutation-checked; waiting for independent review'
- '2026-11-16 reviewer: CHANGES_REQUESTED. #1 (one-lock test could not fail; the review never ran) FIXED:
  test now asserts the review phase ran locked, mutation (review dedented out of the lock) caught. #2
  (cancel releases lock while a to_thread write may finish) ACCEPTED, documented in README. #3 (git timeout
  vs grandchild holding the pipe) REFUTED: measured 1.0 s for a 1 s timeout with a sleeping grandchild
  on POSIX. #4 (claim ownership keyed on exception type) ACCEPTED, very unlikely behind the entry-point
  lock. #5 (holder note window) ACCEPTED, cosmetic, documented.'
- '2026-11-16 reviewer round 2: APPROVED. Codex P2 (git timeout kills only git, descendants outlive the
  lock) verified real for hooks that fork: fixed with a process group kill (POSIX), test with a hook whose
  background child must not survive; mutation (kill only git) caught.'
- '2026-11-16 Sourcery (9 findings on e1e8dc7) triaged. FIXED: git descendants (process group), job left
  running when create_task fails (job removed, test + mutation), one-lock test (already fixed). ACCEPTED
  and documented: git clean deleting the lock file, orphan git after kill -9, post-commit hook timeout
  reported as blocked, holder-note window. DECLINED: evidence run must not take the lock (an agent calls
  it inside a wave that holds it; would deadlock); symlink swap of .harness between check and open (needs
  an attacker who can already write the project; reported to the user as an open security-labelled finding).'
- '2026-11-17 reviewer round 3 (commit.py process group): APPROVED. Taken: post-kill communicate bounded
  (REAP_TIMEOUT 5 s) because a helper that escapes the group via setsid could hold the pipes and hang
  under the lock; test + mutation caught. Documented: git loses its controlling tty (gpgsign pinentry
  on tty). Tests are skipped on non-POSIX.'
- '2026-11-17 reviewer round 4 (delta: _reap bound, create_task cleanup): APPROVED. Sourcery check failed
  on subprocess.CompletedProcess(...) in commit.py (dangerous-subprocess-use-audit): false positive (a
  data holder, fixed argv, no shell), but avoidable without behaviour change, so _run now returns a small
  GitResult dataclass.'
review:
  by: reviewer
  status: approved
  notes: 'Round 4 (fresh read-only reviewers): APPROVED, no blocking defect. Round 1 CHANGES_REQUESTED:
    the one-lock test never ran the review (fixed, mutation-proven); a cancel releasing the lock while
    a to_thread write may finish, claim ownership keyed on exception type and the holder-note window accepted
    and documented. Round 2 and 3 approved the fixes and the process-group kill for git timeouts (Codex
    P2, real, mutation-proven), the bounded wait after the kill (setsid escape) and the create_task cleanup.
    After the last review only _run''s result type changed (GitResult instead of CompletedProcess, to
    clear a Sourcery false positive); tests unchanged and green, not reviewed again. Evidence E13-E15
    was recorded one evidence/doc-only commit before the merged head. Open: Sourcery''s security-labelled
    symlink swap of .harness between check and open (declined: needs a writer on the project dir; owner
    to decide). Accepted limits: git clean -fd deleting the lock file, orphan git after kill -9, post-commit
    hook timeout reported as blocked, no TLS, flock on NFS, Windows untested.'
