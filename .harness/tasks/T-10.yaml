schema_version: 1
id: T-10
title: 'Uygulama adım 5: görev başına commit ve kapsamın kodla denetimi (harness commit)'
owner: developer
status: DONE
goal: DONE görevleri tek dalda görev başına bir commit olarak işleyen ve hiçbir görevin açıklamadığı
  değişikliği kodla yakalayıp commit'leri durduran katman. Reviewer'ın git ile doğrulayamadığı
  kapsam denetimi böylece modelin okumasına bırakılmaz.
scope:
- src/agent_harness/commit.py
- src/agent_harness/cli.py
- tests/
- README.md
- .harness/
acceptance:
- id: AC1
  text: Her DONE görev, commit'i yoksa, yalnız sahip olduğu dosyalarla (kapsamı ve kendi defter
    dosyaları) ayrı bir commit olur; açık yol verilerek stage edilir ve hiçbir şey push edilmez.
  verified_by:
  - E13
- id: AC2
  text: Bir dosya tek göreve gider, en spesifik kapsam kazanır, eşitlikte küçük görev numarası;
    geniş kapsam başka görevin adıyla andığı dosyayı yutmaz; çalışan görevin dosyası commit'lenmez.
  verified_by:
  - E13
- id: AC3
  text: Hiçbir görevin açıklamadığı değişiklik varsa hiçbir commit atılmaz ve dosya adları
    söylenir; üretilen dosyalar (pycache, pyc, lock) sayılmaz.
  verified_by:
  - E13
- id: AC4
  text: Aynı komutun ikinci çalıştırması commit atmaz; depo kökü değilse, index'te stage edilmiş
    değişiklik, bozuk defter ya da bilinmeyen görev varsa hata verir; --branch dalı oluşturur
    ya da kullanır.
  verified_by:
  - E13
- id: AC5
  text: '`harness commit [PATH] [--task] [--branch] [--json]` sonucu gösterir; engellenen
    görev yoksa 0, varsa 1 ile çıkar. Testler yalnız unit testtir, gerçek git deposunda çalışır.'
  verified_by:
  - E13
  - E14
  - E15
