review:
  status: changes_requested
  by: reviewer
  notes: 'Round 1 (read-only reviewer subagent, ran nothing): CHANGES REQUESTED. HIGH git add -- still expands pathspec globs so a file named src/*.py could stage a running task''s file; file paths went through the scope-entry parser so names like ~x, a:b or a*b became owned by everybody. MEDIUM a failed commit left files staged and lost earlier results; the .lock filter hid uv.lock; the already-committed check matched any body line and was not branch-aware; branch names were not validated; an unborn repository failed confusingly. LOW unmerged paths, nested repositories, trust boundary, identity fallback, weak tests. All fixed afterwards (literal pathspecs, literal path matching, index reset with partial results, narrow generated filter, subject-exact check on the target branch, branch name validation, unborn and detached HEAD handling) with 28 new tests; the fixes are not re-reviewed yet.'
log:
- 2026-11-16 görev açıldı. Gerçek oturum denemesi (geçici proje) bir hata buldu - geniş kapsamlı
  T-1 diğer görevlerin dosyalarını yutuyordu; en spesifik sahip kuralı ile düzeltildi ve gerçek
  projede dört görev doğru ayrı commit'lendi.
