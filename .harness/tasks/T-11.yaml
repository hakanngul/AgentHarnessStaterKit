  serve)'
owner: developer
status: IN_REVIEW
goal: Defteri (plan, görevler, check) JSON olarak sunan, yalnız loopback adresinde dinleyen
  ve her isteği token ile doğrulayan FastAPI sunucusu. Eylemler (wave, review, commit) ve
  canlı olaylar sonraki görev; bu görev yalnız okur, hiçbir şey yazmaz ve ajan çalıştırmaz.
