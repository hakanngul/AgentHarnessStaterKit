review:
  status: changes_requested
  by: reviewer
  notes: 'Round 1: no auth bypass or write path found. Requested: (1) OSError/UnicodeError
    not handled, (2) AC1 only partly tested, (3) weak never-writes snapshot, (4) uvicorn host
    never asserted, (5) token printed before validation and echoed from env. All five fixed,
    plus strict Host regex, ASCII-only task ids, port range. Each fix proven by a mutation
    check (revert the fix, a test fails). Sonar S5332 on the http:// banner removed by printing
    host:port only. Round 2 asked: serve refuses bad host/port without touching uvicorn (test),
    project path validated before banner, AC1 path-leak claim softened, re.ASCII and ASCII-only
    strip on Host. Done.'
