schema_version: 1
id: T-11
title: 'Uygulama adım 6a: yerel HTTP sunucusu, salt okunur API ve kimlik doğrulama (harness
  serve)'
owner: developer
status: IN_REVIEW
goal: Defteri (plan, görevler, check) JSON olarak sunan, yalnız loopback adresinde dinleyen
  ve her isteği token ile doğrulayan FastAPI sunucusu. Eylemler (wave, review, commit) ve
  canlı olaylar sonraki görev; bu görev yalnız okur, hiçbir şey yazmaz ve ajan çalıştırmaz.
scope:
- src/agent_harness/server.py
- src/agent_harness/cli.py
- tests/test_server.py
- pyproject.toml
- uv.lock
- README.md
- .harness/
acceptance:
- id: AC1
  text: GET /api/plan, /api/check, /api/tasks ve /api/tasks/{id} defterdeki gerçek veriyi
    JSON döner; geçersiz görev kimliği 404 verir, okunamayan ya da bozuk görev dosyası 422
    (listede o satır `error` alanı taşır, diğerleri görünür kalır), bozuk defter plan ve check
    gövdesinde errors olarak raporlanır; hiçbiri 500 vermez ve dosya yazmaz; görev uçları
    ve liste satırları dosya yolu sızdırmaz, plan ve check gövdesindeki hata metinleri ise
    yetkili istemciye yol içerebilir (README'de yazılı).
- id: AC2
  text: /api/health dışındaki her istek geçerli Bearer token ister (sabit zamanlı karşılaştırma);
    eksik ya da yanlış token 401 verir.
- id: AC3
  text: Host başlığı katı biçimde loopback adı (isteğe bağlı sayısal port) değilse istek token
    bakılmadan 403 ile reddedilir (DNS rebinding); sunucu loopback dışı bir adrese ya da geçersiz
    porta bağlanmayı reddeder ve uvicorn'a yalnız doğrulanmış host/port verilir.
- id: AC4
  text: '`harness serve [PATH] [--port]` proje yolunu, host''u, portu ve token''ı doğruladıktan
    sonra yalnız kendi ürettiği token''ı bir kez yazar (HARNESS_TOKEN verilmişse onu yazmaz
    ve kullanır), fastapi/uvicorn yoksa kurulum yolunu söyleyen bir hata verir; bağımlılıklar
    `server` extra olarak tanımlıdır.'
- id: AC5
  text: Testler yalnız unit testtir (TestClient, gerçek ledger dosyaları); pytest, ruff check
    ve ruff format --check geçer.
