- README.md
- .harness/
acceptance:
- id: AC1
  text: GET /api/plan, /api/check, /api/tasks ve /api/tasks/{id} defterdeki gerçek veriyi
    JSON döner; geçersiz görev kimliği 404, bozuk defter 422 verir ve hiçbiri dosya yazmaz.
- id: AC2
  text: /api/health dışındaki her istek geçerli Bearer token ister (sabit zamanlı karşılaştırma);
    eksik ya da yanlış token 401 verir.
- id: AC3
  text: Host başlığı loopback adı değilse istek 403 ile reddedilir (DNS rebinding); sunucu
    loopback dışı bir adrese bağlanmayı reddeder.
- id: AC4
  text: '`harness serve [PATH] [--port]` token üretip bir kez yazar (HARNESS_TOKEN verilmişse
    onu kullanır), fastapi/uvicorn yoksa kurulum yolunu söyleyen bir hata verir; bağımlılıklar
    `server` extra olarak tanımlıdır.'
- id: AC5
  text: Testler yalnız unit testtir (TestClient, gerçek ledger dosyaları); pytest, ruff check
    ve ruff format --check geçer.
